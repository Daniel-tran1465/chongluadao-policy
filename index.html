:root{--red:#C4201A;--gold:#FFCD00;--bg:#F7F3EF;--text:#241512}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 'Segoe UI',Roboto,Arial,sans-serif}
header{background:linear-gradient(45deg,#6E0D0A,#C4201A 60%,#F0552F);color:var(--gold);padding:28px 20px}
header h1{margin:0;font-size:1.4rem} header p{margin:.3rem 0 0;color:#FFF3D6;font-size:.95rem}
main{max-width:820px;margin:0 auto;padding:20px}
h1,h2,h3{line-height:1.3} h2{margin-top:2rem;color:var(--red)}
table{border-collapse:collapse;width:100%;margin:1rem 0;background:#fff}
th,td{border:1px solid #E5DDD5;padding:8px 10px;text-align:left;vertical-align:top;font-size:.93rem}
th{background:#FDE7E4} blockquote{margin:1rem 0;padding:.6rem 1rem;background:#FFF3D6;border-left:4px solid var(--gold)}
code{background:#EFE9E3;padding:1px 5px;border-radius:4px} a{color:var(--red)}
footer{max-width:820px;margin:0 auto;padding:20px;color:#6B5F58;font-size:.85rem}
@media (prefers-color-scheme:dark){:root{--bg:#140E0C;--text:#F5EDE6} table{background:#221816} th{background:#4A1F1B}
th,td{border-color:#3A2A22} blockquote{background:#2E211E} code{background:#2E211E} a{color:#FF8A80} h2{color:#FF8A80}}
